name: Build RearBoost

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build VST3
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release

      - name: Find plugin
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Include *.vst3

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" |
            Copy-Item -Destination artifact -Recurse -Force
          Get-ChildItem -Path artifact -Recurse

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RearBoost-VST3
          path: artifact
