name: Build RearBoost

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Find plugin
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Include *.vst3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RearBoost-VST3
          path: build/**/*.vst3
