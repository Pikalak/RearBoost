name: Build RearBoost

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build VST3
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release

      - name: Find RearBoost
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "RearBoost.vst3"

      - name: Package RearBoost
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item "build\VST3\Release\RearBoost.vst3" "artifact\RearBoost.vst3" -Recurse -Force

      - name: Upload RearBoost
        uses: actions/upload-artifact@v4
        with:
          name: RearBoost-VST3
          path: artifact
